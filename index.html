<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Hidden Bite – Вход через Telegram asd</title>
  <script async src="https://telegram.org/js/telegram-widget.js?22"
          data-telegram-login="hidden_bite_bot"
          data-size="large"
          data-userpic="true"
          data-request-access="write"
          data-lang="ru"
          data-onauth="onTelegramAuth(user)">
  </script>
  <script>
    function onTelegramAuth(user) {
      if (window.TelegramAuth && window.TelegramAuth.postMessage) {
        window.TelegramAuth.postMessage(JSON.stringify({
          id: user.id,
          first_name: user.first_name,
          last_name: user.last_name,
          username: user.username,
          photo_url: user.photo_url,
          auth_date: user.auth_date,
          hash: user.hash
        }));
      } else {
        document.body.innerHTML =
          '<h2>Успешный вход, ' + (user.first_name || 'пользователь') + '!</h2>';
        console.log('Telegram user:', user);
      }
    }
  </script>
</head>
<body>
  <h1>Вход через Telegram для Hidden Bite</h1>
  <p>Нажмите кнопку ниже, чтобы войти через Telegram.</p>
</body>
</html>
